networks:
  cqu:
    driver: bridge

volumes:
  pgadmin_data:
  postgres_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: cqu_db
    environment:
      POSTGRES_USER: cqu_user
      POSTGRES_PASSWORD: cqu_password
      POSTGRES_DB: cqu_db
    volumes:
      - postgres_data:/var/lib/postgresql/data   # keep database permanently
      - ./scripts:/docker-entrypoint-initdb.d    # optional: custom SQL scripts
    ports:
      - "5430:5432"    # Host -> Container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cqu

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-1
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "testemail@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "testuser123"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cqu

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cqu.api
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./src:/opt/app/src
      - ./database:/opt/app/database           # ← Alembic migrations & env.py
      - ./alembic.ini:/opt/app/alembic.ini     # Required for Alembic
      - ./pyproject.toml:/opt/app/pyproject.toml
      - ./cli.py:/opt/app/cli.py
    ports:
      - "8000:8000"
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cqu
